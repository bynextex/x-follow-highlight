<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X Follow Highlight</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-wrapper">
          <img src="icons/icon48.png" alt="X Follow Highlight Logo" class="brand-icon">
        </div>
        <div class="brand-text">
          <h1 class="brand-title">X Follow Highlight</h1>
          <span class="version-badge">v1.0.1</span>
        </div>
      </div>
    </header>

    <!-- Main Control Card -->
    <main class="control-card">
      <div class="toggle-row">
        <div class="status-indicator">
          <span class="status-dot" id="status-dot"></span>
          <span class="status-text" id="status-text">Highlighting is on</span>
        </div>
        <label class="switch" for="toggle-switch">
          <input type="checkbox" id="toggle-switch" checked aria-label="Toggle X Follow Highlighting">
          <span class="slider"></span>
        </label>
      </div>

      <p class="description">
        Automatically detects accounts that follow you on X and highlights the indicator in bright green, regardless of interface language.
      </p>

      <div class="feature-badges">
        <span class="badge">
          <svg class="badge-icon" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0zm3.707 6.707-4.5 4.5a1 1 0 0 1-1.414 0l-2-2a1 1 0 1 1 1.414-1.414L6.5 9.086l3.793-3.793a1 1 0 1 1 1.414 1.414z"/>
          </svg>
          Language Independent
        </span>
        <span class="badge">
          <svg class="badge-icon" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 1a7 7 0 1 0 7 7A7.008 7.008 0 0 0 8 1zm0 12.5A5.5 5.5 0 1 1 13.5 8 5.506 5.506 0 0 1 8 13.5zM8 3.5a1 1 0 0 0-1 1V8a1 1 0 0 0 .293.707l2.5 2.5a1 1 0 0 0 1.414-1.414L9 7.586V4.5a1 1 0 0 0-1-1z"/>
          </svg>
          Real-time SPA
        </span>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-status" id="storage-status">Saved across sessions</div>
      <a href="https://github.com/bynextex/x-follow-highlight" target="_blank" rel="noopener noreferrer" class="repo-link" title="View Source on GitHub">
        <svg class="github-icon" viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        GitHub
      </a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
